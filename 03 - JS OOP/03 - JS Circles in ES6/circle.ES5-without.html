<!DOCTYPE html>
<html>
<head>
    <title>Drawing Circles - ES5 (No Prototype)</title>
    <style>
        .box {
            display: inline-block;
            width: 60px;
            height: 35px;
            border: 2px solid black;
        }

        #screen {
            width: 100%;
            height: 700px;
        }

        .circle {
            position: absolute;
            border: 3px solid black;
            border-radius: 50%;
        }
        .reset {
            position: absolute;
            left: 90%;
            top: 1%;
        }
        #reset {
            width: 100px;
            height: 25px;
        }
    </style>
</head>
<body>

    <div class="box" id="green" color_of="#00ff00" style="background-color:#00ff00"></div>
    <div class="box" id="blue" color_of="#007bff" style="background-color:#007bff"></div>
    <div class="box" id="purple" color_of="#7700ff" style="background-color:#7700ff"></div>
    <div class="reset">
        <button id="reset">Reset</button>
    </div>

    <div id="screen"></div>

    <script>
        var board = document.getElementById("screen");
        var boxes = document.querySelectorAll(".box");

        var color = "#00ff00";

        // CIRCLE
        function Circle(x, y, radius, color) {
            this.radius = radius;
            this.left = x - radius;
            this.top = y - radius;
            this.color = color;
            this.element = null;

            this.display = function() {
                this.element = document.createElement("div");
                this.element.className = "circle";
                this.element.style.width = (this.radius * 2) + "px";
                this.element.style.height = (this.radius * 2) + "px";
                this.element.style.left = this.left + "px";
                this.element.style.top = this.top + "px";
                this.element.style.backgroundColor = this.color;

                board.appendChild(this.element);
            };

            this.shrink = function() {
                var self = this;
                var size = this.radius * 2;
                var left = this.left;
                var top = this.top;

                var timer = setInterval(function() {
                    size = size - 2;
                    left = left + 1;
                    top = top + 1;

                    if (size <= 0) {
                        clearInterval(timer);
                        if (self.element.parentNode != null) {
                            board.removeChild(self.element);
                        }
                    }
                    else {
                        self.element.style.width = size + "px";
                        self.element.style.height = size + "px";
                        self.element.style.left = left + "px";
                        self.element.style.top = top + "px";
                    }
                }, 50);
            };
        }

        // CHANGE COLOR
        let i = 0;
        for (i = 0; i < boxes.length; i++) {
            boxes[i].addEventListener("click", function() {
                color = this.dataset.color;
            });
        }

        // RESET
        document.getElementById("reset").addEventListener("click", function() {
            board.innerHTML = "";
        });

        // CLICK
        board.addEventListener("click", function(event) {
            var radius = Math.floor(Math.random() * 191) + 10;

            var circle = new Circle(event.pageX, event.pageY, radius, color);
            circle.display();
            circle.shrink();
        });
    </script>

</body>
</html>
