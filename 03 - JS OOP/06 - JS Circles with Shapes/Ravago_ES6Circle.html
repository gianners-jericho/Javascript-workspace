<!DOCTYPE html>
<html>
  <head>
    <title>ES6 Shapes</title>
    <style>
      
      .menu, .color-picker, .shape-picker {
        display: flex;
        flex-direction: row;
        gap: 12px;
      }

      .menu {
        justify-content: space-between;
      }

      .shape-picker {
        justify-content: end;
      }

      .color-picker div, .shape{
        height: 50px;
        width: 50px;
        border: 2px solid black;
      }

      .circle {
        border-radius: 50%;
      }

      .parallelogram {
        transform: skew(20deg);
      }

      body {
        margin: 5em;
      }
    </style>
    <script src="Ravago_ES6Circle_Script.js"></script>
  </head>
  <body>
    <div class="menu">
      <div>
        <p>Selected Color: <span id="color_display"></span></p>
        <div class="color-picker">
          <div data-value="tomato"></div>
          <div data-value="orange"></div>
          <div data-value="dodgerblue"></div>
          <div data-value="mediumseagreen"></div>
        </div>
      </div>

      <div>
        <p>Selected Shape: <span id="shape_display"></span></p>
        <div class="shape-picker">
          <div class="shape circle" data-value="circle"></div>
          <div class="shape box" data-value="square"></div>
          <div class="shape parallelogram" data-value="parallelogram"></div>
        </div>

      </div>
    </div>
    <div id="screen" style="margin-top: 2rem; background-color: black; border: 1px solid red; height: 500px;">

    </div>
  </body>

  <script>
    let color = "tomato"; // default value
    let shape = "circle";

    document.getElementById('screen').onclick = function (e) {
        createShape(shape, color, e.clientX, e.clientY);
    }

    const shape_elements = document.querySelectorAll('.shape');
    const colors = document.querySelectorAll('.color-picker div');
    const shape_display = document.getElementById('shape_display');
    const color_display = document.getElementById('color_display');

    // set shape
    for(let i = 0; i < shape_elements.length; i++){
      let value = shape_elements[i].dataset.value;

      shape_elements[i].onclick = function(e){
        shape = value;
        shape_display.innerText = shape;

        // remove background color from all elements
        for(let i = 0; i < shape_elements.length; i++){
          shape_elements[i].style.backgroundColor = "";
        }

        shape_elements[i].style.backgroundColor = color;
      }
    }

    // set color
    for(let i = 0; i < colors.length; i++){
      let value = colors[i].dataset.value;

      colors[i].style.backgroundColor = value;
      colors[i].onclick = function(e){
        color = value;
        color_display.innerText = color;

        for(let i = 0; i < shape_elements.length; i++){
          const element = shape_elements[i];

          if(!element.style.backgroundColor == ""){
            element.style.backgroundColor = color;
          }
        }
      }
    }
  </script>
</html>
