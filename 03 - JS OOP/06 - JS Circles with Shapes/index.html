<!DOCTYPE html>
<html>
<head>
    <title>Drawing Circles with Shapes</title>
    <style>
        .color-box {
            display: inline-block;
            width: 60px;
            height: 35px;
            border: 2px solid black;
            cursor: pointer;
        }

        .shape-btn {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 2px solid black;
            margin-left: 10px;
            cursor: pointer;
            vertical-align: middle;
            position: relative;
        }

        .shape-btn[data-shape="circle"] {
            border-radius: 50%;
        }

        .shape-btn[data-shape="star"] {
            border: none;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        #reset-box {
            position: absolute;
            left: 90%;
            top: 1%;
        }
        #reset {
            width: 100px;
            height: 25px;
        }

        #screen {
            width: 100%;
            height: 700px;
        }

        .shape {
            position: absolute;
        }

        .shape.circle, .shape.rectangle {
            border: 3px solid black;
        }

        .shape.circle {
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="color-box" color_of="#00ff00" style="background-color:#00ff00"></div>
    <div class="color-box" color_of="#007bff" style="background-color:#007bff"></div>
    <div class="color-box" color_of="#7700ff" style="background-color:#7700ff"></div>

    <span class="shape-btn" data-shape="circle"></span>
    <span class="shape-btn" data-shape="rectangle"></span>
    <span class="shape-btn" data-shape="star"></span>

    <div id="reset-box">
        <button id="reset">Reset</button>
    </div>

    <div id="screen"></div>

    <script>
        // PARENT CLASS
        class Shape {
            constructor(x, y, size, color) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.color = color;
            }

            get left() {
                return this.x - this.size / 2;
            }

            get top() {
                return this.y - this.size / 2;
            }

            //SHRINK
            shrink(board) {
                const timer = setInterval(() => {
                    this.size -= 4;

                    if (this.size <= 0) {
                        clearInterval(timer);
                        this.remove(board);
                    } else {
                        this.updatePosition();
                    }
                }, 50);
            }
        }

        class Circle extends Shape {
            render(board) {
                this.element = document.createElement("div");
                this.element.className = "shape circle";
                this.element.style.backgroundColor = this.color;
                this.updatePosition();
                board.appendChild(this.element);
            }

            updatePosition() {
                this.element.style.width = this.size + "px";
                this.element.style.height = this.size + "px";
                this.element.style.left = this.left + "px";
                this.element.style.top = this.top + "px";
            }

            remove(board) {
                if (this.element.parentNode != null) {
                    board.removeChild(this.element);
                }
            }
        }

        class Rectangle extends Shape {
            render(board) {
                this.element = document.createElement("div");
                this.element.className = "shape rectangle";
                this.element.style.backgroundColor = this.color;
                this.updatePosition();
                board.appendChild(this.element);
            }

            updatePosition() {
                this.element.style.width = this.size + "px";
                this.element.style.height = this.size + "px";
                this.element.style.left = this.left + "px";
                this.element.style.top = this.top + "px";
            }

            remove(board) {
                if (this.element.parentNode != null) {
                    board.removeChild(this.element);
                }
            }
        }

        //
        class Star extends Shape {
            render(board) {
                this.element = document.createElement("div");
                this.element.className = "shape star";
                this.element.style.backgroundColor = this.color;
                this.element.style.clipPath = "polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)";
                this.updatePosition();
                board.appendChild(this.element);
            }

            updatePosition() {
                this.element.style.width = this.size + "px";
                this.element.style.height = this.size + "px";
                this.element.style.left = this.left + "px";
                this.element.style.top = this.top + "px";
            }

            remove(board) {
                if (this.element.parentNode != null) {
                    board.removeChild(this.element);
                }
            }
        }

        const board = document.getElementById("screen");
        const colorBoxes = document.querySelectorAll(".color-box");
        const shapeButtons = document.querySelectorAll(".shape-btn");

        let color = "#00ff00";
        let shape = "circle";

        // change the selected shape button with the current color.
        function updateShapeButtons() {
            shapeButtons.forEach((btn) => {
                const isSelected = btn.dataset.shape === shape;
                btn.style.backgroundColor = isSelected ? color : "white";
            });
        }

        // CHANGE COLOR
        colorBoxes.forEach((box) => {
            box.addEventListener("click", () => {
                color = box.dataset.color;
                updateShapeButtons();
            });
        });

        // CHANGE SHAPE
        shapeButtons.forEach((btn) => {
            btn.addEventListener("click", () => {
                shape = btn.dataset.shape;
                updateShapeButtons();
            });
        });

        // RESET
        document.getElementById("reset").addEventListener("click", () => {
            board.innerHTML = "";
        });

        // CLICK
        board.addEventListener("click", (event) => {
            const size = (Math.floor(Math.random() * 191) + 10) * 2;
            let newShape;

            if (shape === "circle") {
                newShape = new Circle(event.pageX, event.pageY, size, color);
            } else if (shape === "rectangle") {
                newShape = new Rectangle(event.pageX, event.pageY, size, color);
            } else {
                newShape = new Star(event.pageX, event.pageY, size, color);
            }

            newShape.render(board);
            newShape.shrink(board);
        });

        updateShapeButtons();
    </script>

</body>
</html>
