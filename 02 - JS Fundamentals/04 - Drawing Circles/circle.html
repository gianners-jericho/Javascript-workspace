<!DOCTYPE html>
<html>
<head>
    <title>Drawing Circles</title>
    <style>
        .box {
            display: inline-block;
            width: 60px;
            height: 35px;
            border: 2px solid black;
        }

        #screen {
            width: 100%;
            height: 700px;
        }

        .circle {
            position: absolute;
            border: 3px solid black;
            border-radius: 50%;
        }
        .reset {
            position: absolute;
            left: 90%;
            top: 1%;
        }
        #reset {
            width: 100px;
            height: 25px;
        }
    </style>
</head>
<body>

    <div class="box" id="green" style="background-color:#00ff00"></div>
    <div class="box" id="blue" style="background-color:#007bff"></div>
    <div class="box" id="purple" style="background-color:#7700ff"></div>
    <div class="reset">
        <button id="reset">Reset</button>
    </div>

    <div id="screen"></div>

    <script>
        var board = document.getElementById("screen");

        var greenBox = document.getElementById("green");
        var blueBox = document.getElementById("blue");
        var purpleBox = document.getElementById("purple");

        // CHANGE COLOR
        greenBox.addEventListener("click", function() {
            color = "#00ff00";
            highlight(greenBox);
        });
        blueBox.addEventListener("click", function() {
            color = "#007bff";
            highlight(blueBox);
        });
        purpleBox.addEventListener("click", function() {
            color = "#7700ff";
            highlight(purpleBox);
        });


        // RESET
        document.getElementById("reset").addEventListener("click", function() {
            board.innerHTML = "";
        });

        //CLICK
        board.addEventListener("click", function(event) {
            var radius = Math.floor(Math.random() * 191) + 10;

            var left = event.pageX - radius;
            var top = event.pageY - radius;

            var circle = document.createElement("div");
            circle.className = "circle";

            circle.style.width = (radius * 2) + "px";
            circle.style.height = (radius * 2) + "px";
            circle.style.left = left + "px";
            circle.style.top = top + "px";
            circle.style.backgroundColor = color;

            board.appendChild(circle);

            shrink(circle, radius * 2, left, top);
        });

        //SHRINK
        function shrink(circle, size, left, top) {

            var timer = setInterval(function() {

                size = size - 2;
                left = left + 1;
                top  = top + 1;

                if (size <= 0) {
                    clearInterval(timer);
                    if (circle.parentNode != null) {
                        board.removeChild(circle);
                    }
                }
                else {
                    circle.style.width = size + "px";
                    circle.style.height = size + "px";
                    circle.style.left = left + "px";
                    circle.style.top = top + "px";
                }
            }, 50);
        }
    </script>

</body>
</html>
