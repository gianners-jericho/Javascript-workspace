<!DOCTYPE HTML>
<html>
    <head>
        <link rel="stylesheet" href = "styles.css">
    </head>
    <body>
        <div class="box">
            <button id = "redButton" type="button">Red</button>
            <button id = "purpleButton" type="button">Purple</button>
            <button id = "greenButton" type="button">Green</button>
        </div>


        <script>

            const config = {
                default_color: "red",
                min_diameter: 10,
                max_diameter: 200,
                shrink_rate: 1.5,
                animation_interval_ms: 25,
            }

            //BUTTONS
            let currentColor = "red"; //red by default

            const redButton = document.getElementById("redButton");
            const purpleButton = document.getElementById("purpleButton");
            const greenButton = document.getElementById("greenButton");

            //BUTTON EVENT LISTENERS
            redButton.addEventListener("click", function(){
                currentColor = "red";
            })

            purpleButton.addEventListener("click", function(){
                currentColor = "purple";
            })

            greenButton.addEventListener("click", function(){
                currentColor = "green";
            })
            
            //CIRCLE IMPLEMENTATION
            class Circle {
                constructor(color, diameter){
                    this.diameter = diameter;
                    this.color = color;
                }

                shrink(decrement){
                    this.diameter -= decrement; 
                }

                get isAlive(){
                    return this.diameter > 0;
                }
            }

            //RETURN RANDOM INTEGER BETWEEN RANGE
            function getRandomInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            //ON CLICK HANDLER
            document.onclick = (e) => {
                console.log("clicked");
                const circleObj = new Circle(currentColor, getRandomInt(config.min_diameter, config.max_diameter));
                const circleElement = document.createElement("div");
                circleElement.className = "circle";
                circleElement.style.left = e.clientX + "px"; 
                circleElement.style.top = e.clientY + "px";
                circleElement.style.width = circleObj.diameter + "px";
                circleElement.style.height = circleObj.diameter + "px";
                circleElement.style.backgroundColor = circleObj.color;
                
                document.body.appendChild(circleElement);

                const shrinkInterval = setInterval(() => {
                    if (circleObj.isAlive) {
                        circleObj.shrink(config.shrink_rate); 
                        
                        circleElement.style.width = circleObj.diameter + "px";
                        circleElement.style.height = circleObj.diameter + "px";
                    } else {
                        clearInterval(shrinkInterval);
                        circleElement.remove();  
                    }
                }, config.animation_interval_ms); 
            }
        </script>
    </body>
</html>
