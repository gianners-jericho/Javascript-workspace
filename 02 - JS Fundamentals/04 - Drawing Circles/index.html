<!DOCTYPE html>
<html>
<head>
    <title>Drawing Circles</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: white;
        }
        .circle {
            position: absolute;
            background-color: #CCE8CC; /* Default green */
        }
    </style>
</head>

<div id="controls" style="position: absolute; top: 10px; left: 10px; z-index: 100; display: flex; gap: 10px; align-items: center;">
    <!-- Color Boxes -->
    <div id="btn-green" style="width: 30px; height: 30px; background-color: #CCE8CC; border: 3px solid black; cursor: pointer;"></div>
    <div id="btn-blue" style="width: 30px; height: 30px; background-color: #CCE8EC; border: 1px solid gray; cursor: pointer;"></div>
    <div id="btn-red" style="width: 30px; height: 30px; background-color: #ECCECE; border: 1px solid gray; cursor: pointer;"></div>
    
    <!-- Reset Button -->
    <button id="btn-reset">Reset</button>
</div>

<body id="canvas-body">    
    <script src="script.js"></script>
</body>
</html>
