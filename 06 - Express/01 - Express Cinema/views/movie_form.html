<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema - Add Movie</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        nav {
            text-align: center;
            margin-top: 10px;
        }
        nav a {
            text-decoration: none;
            color: #0066cc;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .form-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px auto;
        }
        .form-section form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 300px;
        }
        .form-group label {
            font-weight: bold;
        }
        .form-group input {
            padding: 6px 8px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 20px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #f0f0f0;
        }
        button:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Cinema Movies</h1>
        <nav>
            <a href="/movies">Movies</a> | 
            <a href="/movies/new">Add Movie</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Add a New Movie</h2>
            <form action="/movies/new" method="POST">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="director">Director:</label>
                    <input type="text" id="director" name="director" required>
                </div>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
</body>
</html>
