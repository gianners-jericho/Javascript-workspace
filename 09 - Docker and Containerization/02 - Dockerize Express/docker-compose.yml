version: '3.2'
services:
  web_game:
    depends_on: 
      db:
        condition: 'service_healthy'
    build: .
    restart: always
    volumes:
      - ./src:/var/www/app/src
      - ./package.json:/var/www/app/package.json
    command: npm start
    ports:
      - 3000:3000

  db:
    image: mysql:8.4
    restart: always
    volumes:
      - db_data:/var/lib/mysql2
      - ./mysql-dump:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: hh
    ports:
      - 3307:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db_data: {}
  mysql_dump: