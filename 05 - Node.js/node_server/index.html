<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js Starter</title>
    <link rel="stylesheet" type="text/css" href="/stylesheets/style.css">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #68a063; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Node.js Server Running!</h1>
        <p>This HTML page was served dynamically using Node's native HTTP module.</p>
    </div>
</body>
</html>
